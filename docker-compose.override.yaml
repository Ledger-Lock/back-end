services:
  postgres:
    image: postgres:17-alpine
    container_name: ledger-lock-postgres
    environment:
      POSTGRES_DB: ledger_lock
      POSTGRES_USER: ledger_lock
      POSTGRES_PASSWORD: ledger_lock_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledger_lock_postgres_data:/var/lib/postgresql/data
    networks:
      - ledger-lock-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ledger_lock -d ledger_lock" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: ledger-lock-kafka
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - ledger_lock_kafka_data:/var/lib/kafka/data
    networks:
      - ledger-lock-net
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger_lock
      SPRING_DATASOURCE_USERNAME: ledger_lock
      SPRING_DATASOURCE_PASSWORD: ledger_lock_dev_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  ledger_lock_postgres_data:
  ledger_lock_kafka_data:

networks:
  ledger-lock-net:
    name: ledger-lock-net
    driver: bridge